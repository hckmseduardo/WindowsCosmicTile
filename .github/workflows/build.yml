name: Windows builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to rebuild and publish (leave empty for build only)'
        required: false
        type: string
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
          - arch: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Install native Rust toolchain
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
          Invoke-WebRequest 'https://static.rust-lang.org/rustup/dist/${{ matrix.target }}/rustup-init.exe' -OutFile $installer
          & $installer -y --profile minimal --default-host '${{ matrix.target }}' --default-toolchain stable --no-modify-path
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          $bin = Join-Path $env:USERPROFILE '.cargo\bin'
          $bin | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          $env:Path = "$bin;$env:Path"
          rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Lint native code
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Smoke-run native executable
        shell: pwsh
        run: |
          $process = Start-Process 'target\${{ matrix.target }}\release\WindowsCosmicTile.exe' -ArgumentList '--version' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Native executable failed: $($process.ExitCode)" }
      - name: Smoke-test in-place restart and rollback
        shell: pwsh
        run: |
          if (Test-Path './tests/update-handoff.ps1') {
            ./tests/update-handoff.ps1 -Executable 'target\${{ matrix.target }}\release\WindowsCosmicTile.exe'
          }
      - name: Package executable and documentation
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $name = "WindowsCosmicTile-v$version-windows-${{ matrix.arch }}"
          $stage = "package\$name"
          New-Item -ItemType Directory -Force $stage, dist | Out-Null
          $exe = 'target\${{ matrix.target }}\release\WindowsCosmicTile.exe'
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $expected = if ('${{ matrix.arch }}' -eq 'arm64') { 0xaa64 } else { 0x8664 }
          if ($machine -ne $expected) { throw "Unexpected PE architecture: $machine" }
          Copy-Item $exe "$stage\WindowsCosmicTile.exe"
          Copy-Item README.md, CHANGELOG.md, docs\QUICKSTART.md $stage
          New-Item -ItemType Directory -Force "$stage\docs" | Out-Null
          Copy-Item docs\QUICKSTART.md, docs\UPDATES.md, docs\RELEASE_NOTES.md "$stage\docs"
          New-Item -ItemType Directory -Force "$stage\assets\brand" | Out-Null
          Copy-Item assets\brand\app-icon.png, assets\brand\BRAND.md "$stage\assets\brand"
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\$name.zip"
          Copy-Item $exe "dist\$name.exe"
          foreach ($extension in @('zip', 'exe')) {
            $file = "$name.$extension"
            $checksum = if ($extension -eq 'zip') { "$name.sha256" } else { "$file.sha256" }
            $hash = (Get-FileHash "dist\$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file" | Set-Content "dist\$checksum" -Encoding utf8NoBOM
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish or update preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          for arch in x64 arm64; do
            test -f "release/WindowsCosmicTile-${RELEASE_TAG}-windows-${arch}.zip"
            test -f "release/WindowsCosmicTile-${RELEASE_TAG}-windows-${arch}.sha256"
            test -f "release/WindowsCosmicTile-${RELEASE_TAG}-windows-${arch}.exe"
            test -f "release/WindowsCosmicTile-${RELEASE_TAG}-windows-${arch}.exe.sha256"
          done
          (cd release && sha256sum --check *.sha256)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.zip release/*.exe release/*.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release/*.zip release/*.exe release/*.sha256 \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "WindowsCosmicTile $RELEASE_TAG" \
              --notes-file docs/RELEASE_NOTES.md --prerelease
          fi
