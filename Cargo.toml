[package]
name = "windows-cosmic-tile"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Native Win32 tiling window manager inspired by COSMIC"
repository = "https://github.com/hckmseduardo/WindowsCosmicTile"
publish = false

[lib]
name = "cosmitile"
path = "src/lib.rs"

[[bin]]
name = "WindowsCosmicTile"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = true
codegen-units = 1
strip = true
