[package]
name = "windows-cosmic-tile"
version = "0.2.4"
edition = "2021"
rust-version = "1.85"
description = "Native Win32 tiling window manager inspired by COSMIC"
repository = "https://github.com/hckmseduardo/WindowsCosmicTile"
publish = false

[lib]
name = "cosmitile"
path = "src/lib.rs"

[[bin]]
name = "WindowsCosmicTile"
path = "src/main.rs"

[dependencies]
serde_json = "1"
semver = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Power", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = true
codegen-units = 1
strip = true
